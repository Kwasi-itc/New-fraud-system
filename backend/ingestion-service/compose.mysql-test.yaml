# Disposable ingestion MySQL integration and process acceptance. No application
# ports, network or database volumes. PostgreSQL is source-parity evidence only.
services:
  mysql:
    image: mysql:8.4.8
    command: ["--log-bin-trust-function-creators=ON", "--binlog-format=ROW"]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-root-only
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
    mem_limit: 2g
    cpus: 2
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: migration_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: ingestion_test_baseline
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      default:
        aliases: [ingestion-parity-postgres-1]
    healthcheck:
      test: [CMD, pg_isready, -U, migration_test, -d, ingestion_test_baseline]
      interval: 2s
      timeout: 2s
      retries: 60
    mem_limit: 512m
  test:
    image: golang:1.25.8
    working_dir: /backend/ingestion-service
    volumes:
      - ..:/backend
      - ingestion_test_go_mod:/go/pkg/mod
      - ingestion_test_go_build:/root/.cache/go-build
    environment:
      INGESTION_MYSQL_TEST_ADDRESS: mysql:3306
      INGESTION_REQUIRE_MYSQL_TEST: "1"
      INGESTION_REQUIRE_PARITY: "1"
      INGESTION_DATA_MODEL_FIXTURE_EXPORTER: /tmp/export-mysql-fixture
      INGESTION_IMPORT_TEST_BINARY: /tmp/import-mysql-receipts
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: [sh, scripts/test-mysql.sh]

volumes:
  ingestion_test_go_mod:
  ingestion_test_go_build:
