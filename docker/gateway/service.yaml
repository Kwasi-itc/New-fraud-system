services:
  api-gateway:
    image: fraud-postgres-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
