  /internal/screening-capabilities:
    get:
      tags: [Internal]
      summary: Advertised scenario authoring capabilities
      description: Configuration-derived capability only, not a provider health check. Requires the dedicated intake credential. No provider request is made and no endpoint or credentials are returned.
      security:
        - screeningIntakeAuth: []
      responses:
        '200':
          description: Configuration-derived address, Person birth-date/nationality and Organization country/registration-number support
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [address_supported, birth_date_supported, nationality_supported, country_supported, registration_number_supported, matching_settings_supported]
                properties:
                  address_supported:
                    type: boolean
                  birth_date_supported:
                    type: boolean
                  nationality_supported:
                    type: boolean
                  country_supported:
                    type: boolean
                  matching_settings_supported:
                    type: boolean
                    description: Explicit threshold, result limit and dataset selection require the configured direct adapter; not a health check.
                  registration_number_supported:
                    type: boolean
        '401':
          description: Dedicated integration credential missing or invalid.
        '503':
          description: Dedicated integration credential not configured.
  /internal/v1/tenants/{tenantId}/decision-screenings:
    post:
      tags: [Internal]
      summary: Create or reuse a decision-linked screening
      description: Internal decision-engine intake endpoint. Calls are idempotent on `idempotency_key`.
      security:
        - screeningIntakeAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreeningRequest'
      responses:
        '401':
          description: Dedicated integration credential missing or invalid.
        '503':
          description: Dedicated integration credential not configured.
        '201':
          description: Screening created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    screeningIntakeAuth:
      type: http
      scheme: bearer
      description: Dedicated SCREENING_INTAKE_TOKEN; distinct from general, operator and opposite-direction credentials.
    investigatorJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 human session with trusted issuer/audience, tenant_id and case_investigator or case_manager_admin role.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant identifier for the screening data being accessed.
      schema:
        type: string
    DecisionId:
      name: decisionId
      in: path
      required: true
      description: Decision identifier associated with the screening work.
      schema:
        type: string
        format: uuid
    ScreeningId:
      name: screeningId
      in: path
      required: true
      description: Screening identifier.
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      description: Screening-match identifier.
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      description: Screening-file identifier.
      schema:
        type: string
    ConfigId:
      name: configId
      in: path
      required: true
      description: Continuous-screening configuration identifier.
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      description: Dataset-update job identifier.
      schema:
        type: string
    MonitoredObjectId:
      name: monitoredObjectId
      in: path
      required: true
      description: Monitored-object identifier.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal processing failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    InvestigatorReviewState:
      type: object
      required: [status, version, eligible, actions]
      properties:
        status: {type: string}
        version: {type: string}
        eligible: {type: boolean}
        actions: {type: array, items: {type: string}}
        machine_outcome: {type: string, description: Original machine result for decisions only}
    GenericObject:
      type: object
      additionalProperties: true
      description: Flexible JSON object returned by the screening service.
    GenericArray:
      type: array
      items:
        type: object
        additionalProperties: true
      description: Flexible JSON array returned by list endpoints.
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          description: Health state.
          example: ok
        service:
          type: string
          description: Service name.
          example: screening-service
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Readiness state.
          example: ready
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    ServiceInfoResponse:
      type: object
      description: Active downstream and provider configuration summary.
      required:
        - service
        - screening_provider_url
        - screening_provider_urls
        - opensanctions_api_host
        - opensanctions_auth_mode
        - opensanctions_scope
        - opensanctions_algorithm
        - ingestion_service_url
        - inbox_service_url
        - case_service_url
        - blob_service_url
        - decision_engine_url
      properties:
        service:
          type: string
          example: screening-service
        screening_provider_url:
          type: string
        screening_provider_urls:
          type: string
        opensanctions_api_host:
          type: string
        opensanctions_auth_mode:
          type: string
        opensanctions_scope:
          type: string
        opensanctions_algorithm:
          type: string
        ingestion_service_url:
          type: string
        inbox_service_url:
          type: string
        case_service_url:
          type: string
        blob_service_url:
          type: string
        decision_engine_url:
          type: string
    SearchQuery:
      type: object
      description: One search query sent to the screening provider.
      required: [name, type]
      properties:
        name:
          type: string
          description: Name or label to screen.
          example: Acme Ltd
        type:
          type: string
          description: Entity type being screened.
          example: Organization
        filters:
          type: object
          additionalProperties: true
          description: Optional provider-side query filters.
    CreateScreeningRequest:
      type: object
      description: Payload for creating a screening request.
      required:
        - provider
        - idempotency_key
        - object_type
        - object_id
        - queries
      properties:
        provider:
          type: string
          description: Screening provider key.
          example: opensanctions
        decision_id:
          type: string
          format: uuid
          description: Decision associated with the screening when applicable.
        scenario_id:
          type: string
          format: uuid
          description: Scenario associated with the screening when applicable.
        screening_config_id:
          type: string
          format: uuid
          description: Screening configuration associated with the request when applicable.
        idempotency_key:
          type: string
          description: Key used to deduplicate repeated screening intake calls.
        object_type:
          type: string
          description: Object type for the screened record.
          example: transactions
        object_id:
          type: string
          description: External record identifier for the screened record.
        queries:
          type: array
          description: Provider search queries to execute.
          items:
            $ref: '#/components/schemas/SearchQuery'
        provider_config:
          type: object
          additionalProperties: true
          description: Provider-specific configuration overrides.
        limit_override:
          type: integer
          description: Optional result-limit override for the provider call.
        unique_counterparty_identifier:
          type: string
          description: Optional counterparty identifier used in screening and whitelist flows.
      example:
        provider: opensanctions
        decision_id: 8c8d8e1d-37f2-4d77-9b88-5a2afba97310
        scenario_id: b41b3c31-d516-47aa-8b73-a4d0458fcbcf
        screening_config_id: a8fe9d01-2f76-4d8d-b77f-6de221a87c9a
        idempotency_key: screening-req-42
        object_type: transactions
        object_id: txn_100234
        queries:
          - name: Example Trading Ltd
            type: Organization
    ScreeningSummary:
      type: object
      description: Basic screening record summary.
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        decision_id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        screening_config_id:
          type: string
          format: uuid
        provider:
          type: string
        status:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScreeningDetailResponse:
      type: object
      description: Screening detail payload with related matches and comments.
      properties:
        screening:
          $ref: '#/components/schemas/ScreeningSummary'
        matches:
          type: array
          items:
            type: object
            additionalProperties: true
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
    ReviewMatchRequest:
      type: object
      description: Review payload for one screening match.
      required: [status, comment, reviewer_id, whitelist]
      properties:
        status:
          type: string
        comment:
          type: string
        reviewer_id:
          type: string
        whitelist:
          type: boolean
    AddCommentRequest:
      type: object
      description: Comment payload for one screening match.
      required: [comment, author_id]
      properties:
        comment:
          type: string
        author_id:
          type: string
    CreateFileRequest:
      type: object
      description: Metadata for a screening evidence file that was already uploaded.
      required: [file_name, content_type, file_size, storage_key, uploaded_by]
      properties:
        file_name:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          format: int64
        storage_key:
          type: string
        uploaded_by:
          type: string
    CreateFileUploadRequest:
      type: object
      description: Request to create a delegated upload session for a screening evidence file.
      required: [file_name, content_type, file_size, uploaded_by]
      properties:
        file_name:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          format: int64
        uploaded_by:
          type: string
    CreateWhitelistRequest:
      type: object
      description: Payload for creating one whitelist entry.
