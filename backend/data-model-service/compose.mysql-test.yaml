# Disposable data-model MySQL fixtures only. No app volumes or published ports.
services:
  mysql:
    image: mysql:8.4.8
    # Disposable restricted-definer installation acceptance only. Application
    # deployment must review this capability and replication policy separately.
    command: ["--log-bin-trust-function-creators=ON", "--binlog-format=ROW"]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-root-only
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: data_model_publication_test
      MYSQL_USER: migration_test
      MYSQL_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  test:
    image: golang:1.25.8
    working_dir: /backend/data-model-service
    volumes:
      - ..:/backend
    environment:
      DATA_MODEL_MYSQL_TEST_ADDRESS: mysql:3306
      DATA_MODEL_REQUIRE_MYSQL_TEST: "1"
      DATA_MODEL_MYSQL_TEST_ROOT_PASSWORD: isolated-test-root-only
    depends_on:
      mysql:
        condition: service_healthy
    # Package suites share one DDL server. Bound package concurrency and allow
    # the entire metadata recovery suite to finish under the race detector.
    command: ["sh", "-ec", "go mod download && go vet ./... && go test -mod=readonly -p=1 -race -count=1 -timeout=900s -v ./cmd/build-mysql-reference ./cmd/migrate-mysql ./cmd/reconcile-physical-mysql ./cmd/inspect-deliveries-mysql ./cmd/redrive-delivery-mysql ./cmd/mysql-worker ./internal/contract ./internal/ports ./internal/worker ./internal/mysqlruntime ./internal/store/mysql/..."]
