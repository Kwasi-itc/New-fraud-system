# Disposable proxy contract tests. No application network, secrets or database.
name: fraud-mysql-gateway-test
services:
  api-gateway:
    extends:
      file: ../../gateway.compose.yaml
      service: api-gateway
    ports: !override ["127.0.0.1:${MYSQL_GATEWAY_TEST_PORT:-18088}:8080"]
    restart: "no"
    depends_on:
      fixture: {condition: service_healthy}
  fixture:
    image: ${MYSQL_GATEWAY_FIXTURE_IMAGE:-node:22-alpine}
    entrypoint: [node]
    command: [/fixture/fixture.mjs]
    volumes: [./fixture.mjs:/fixture/fixture.mjs:ro]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      default:
        aliases: [data-model-service, ingestion-service, decision-engine-service, screening-service, case-manager-service, auth-service, keycloak]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 128m
