# EC2 main stack, one public gateway. Compose 2.24.4+ supports !reset/!override.
x-private-api: &private-api
  GIN_MODE: release

x-ec2-origins: &ec2-origins
  SERVICE_ALLOWED_ORIGINS: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}
  ALLOWED_ORIGINS: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}

services:
  auth-service:
    environment:
      AUTH_TOKEN_ENDPOINT_URL: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}/oauth/token
      <<: *ec2-origins
      AUTH_DEFAULT_TENANT_ID: ${AUTH_DEFAULT_TENANT_ID:-}
      OIDC_ISSUER_URL: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}/identity/realms/fraud
      OIDC_BACKCHANNEL_ORIGIN: http://keycloak:8080
      OIDC_REDIRECT_URL: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}/api/auth/callback
      AUTH_APP_ORIGIN: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro

  keycloak:
    ports: !reset []
    environment:
      KC_HOSTNAME: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      FRAUD_AUTH_REDIRECT_URI: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}/api/auth/callback
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /identity/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]

  data-model-service:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/data-model-service.env
    ports: !reset []
    environment:
      <<: *ec2-origins

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/data-model-service-private.pem:/run/secrets/data-model-service-private.pem:ro

  ingestion-service:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/ingestion-service.env
    ports: !reset []
    environment:
      <<: [*private-api, *ec2-origins]
    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/ingestion-service-private.pem:/run/secrets/ingestion-service-private.pem:ro

  ingestion-worker:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/ingestion-worker.env
    environment: *private-api

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/ingestion-worker-private.pem:/run/secrets/ingestion-worker-private.pem:ro

  decision-engine-service:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/decision-engine-service.env
    ports: !reset []
    environment:
      <<: [*private-api, *ec2-origins]
      GEOIP_MMDB_PATH: ""
    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/decision-engine-service-private.pem:/run/secrets/decision-engine-service-private.pem:ro
  decision-engine-worker:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/decision-engine-worker.env
    restart: unless-stopped
    environment:
      <<: *private-api
      GEOIP_MMDB_PATH: ""

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/decision-engine-worker-private.pem:/run/secrets/decision-engine-worker-private.pem:ro

  screening-service:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-service.env
    ports: !reset []
    environment:
      <<: [*private-api, *ec2-origins]
      SCREENING_PROVIDER_URL: ${SCREENING_PROVIDER_URL:-}
      SCREENING_PROVIDER_URLS: ${SCREENING_PROVIDER_URLS:-}
      OPENSANCTIONS_API_HOST: ${OPENSANCTIONS_API_HOST:-}
      OPENSANCTIONS_AUTH_METHOD: ${OPENSANCTIONS_AUTH_METHOD:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OPENSANCTIONS_SCOPE: ${OPENSANCTIONS_SCOPE:-default}
    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-service-private.pem:/run/secrets/screening-service-private.pem:ro

  screening-worker:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-worker.env
    environment:
      <<: *private-api
      SCREENING_PROVIDER_URL: ${SCREENING_PROVIDER_URL:-}
      SCREENING_PROVIDER_URLS: ${SCREENING_PROVIDER_URLS:-}
      OPENSANCTIONS_API_HOST: ${OPENSANCTIONS_API_HOST:-}
      OPENSANCTIONS_AUTH_METHOD: ${OPENSANCTIONS_AUTH_METHOD:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OPENSANCTIONS_SCOPE: ${OPENSANCTIONS_SCOPE:-default}
    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-worker-private.pem:/run/secrets/screening-worker-private.pem:ro

  screening-case-delivery-worker:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-case-delivery-worker.env
    environment: *private-api

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/screening-case-delivery-worker-private.pem:/run/secrets/screening-case-delivery-worker-private.pem:ro

  case-manager-service:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/case-manager-service.env
    ports: !reset []
    environment:
      <<: *ec2-origins

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/case-manager-service-private.pem:/run/secrets/case-manager-service-private.pem:ro

  frontend:
    env_file:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/frontend-bff.env
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_DATA_MODEL_SERVICE_URL: ""
        NEXT_PUBLIC_INGESTION_SERVICE_URL: ""
        NEXT_PUBLIC_DECISION_ENGINE_SERVICE_URL: ""
        NEXT_PUBLIC_DATA_MODEL_TENANT_ID: ""
    environment:
      APP_ORIGIN: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:${POSTGRES_GATEWAY_PORT:-8088}}
      # HTTP only for private EC2 testing. Set AUTH_COOKIE_SECURE=true when using HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CASE_SESSION_COOKIE: ${CASE_SESSION_COOKIE:-fraud_session}
      INGESTION_SERVICE_URL: http://ingestion-service:8081
      NEXT_PUBLIC_DATA_MODEL_SERVICE_URL: ""
      NEXT_PUBLIC_INGESTION_SERVICE_URL: ""
      NEXT_PUBLIC_DECISION_ENGINE_SERVICE_URL: ""
      NEXT_PUBLIC_DATA_MODEL_TENANT_ID: ""

    volumes:
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/public-keys.json:/run/secrets/public-keys.json:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}/frontend-bff-private.pem:/run/secrets/frontend-bff-private.pem:ro

  root-tenant-setup:
    image: node:22-alpine
    profiles: [setup]
    working_dir: /workspace
    entrypoint: ["node"]
    command: ["docker/setup-root-tenant-ec2.mjs", "--project", "${COMPOSE_PROJECT_NAME:-new-fraud-system}"]
    volumes:
      - ./docker:/workspace/docker:ro
      - ./.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}:/workspace/.local/${COMPOSE_PROJECT_NAME:-new-fraud-system}:ro
    restart: "no"

  api-gateway:
    extends:
      file: docker/gateway/service.yaml
      service: api-gateway
    ports:
      - ${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_GATEWAY_PORT:-8088}:8080
    depends_on:
      frontend: {condition: service_healthy}
      keycloak: {condition: service_healthy}