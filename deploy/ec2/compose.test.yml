name: fraud-ec2-gateway-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fixture
      POSTGRES_DB: fixture
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - ../../.local/ec2-tests/postgres-password.txt:/run/secrets/postgres-password:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fixture -d fixture]
      interval: 2s
      timeout: 3s
      retries: 20
  fixture:
    extends:
      file: ../../docker/gateway/compose.test.yaml
      service: fixture
  api-gateway:
    extends:
      file: ../../docker/gateway/service.yaml
      service: api-gateway
    volumes: !override
      - ../../.local/ec2-tests/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: "no"
    depends_on:
      fixture: {condition: service_healthy}
  tls-edge:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      EC2_DOMAIN: fraud.example.test
      EC2_ACME_EMAIL: ops@example.test
    ports:
      - "127.0.0.1:${EC2_TEST_HTTP_PORT:-18089}:80"
      - "127.0.0.1:${EC2_TEST_HTTPS_PORT:-18443}:443"
    volumes:
      - ../../.local/ec2-tests/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      api-gateway: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/healthz]
      interval: 2s
      timeout: 3s
      retries: 20
