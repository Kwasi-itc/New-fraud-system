# Disposable fixtures only. No Aurora, application state, host DB port or credentials.
name: fraud-ec2-gateway-test
services:
  offline:
    build: {context: ., dockerfile: Dockerfile.test-runner}
    volumes: [../../:/repo:ro]
  certs:
    extends: {file: ../../backend/mysqlstore/compose.test.yaml, service: certs}
  mysql:
    extends: {file: ../../backend/mysqlstore/compose.test.yaml, service: mysql}
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD: isolated-ec2-test-root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: keycloak
      MYSQL_USER: jdbc_fixture
      MYSQL_PASSWORD: isolated-jdbc-test-password
    command: ["--ssl-ca=/certs/ca.pem", "--ssl-cert=/certs/server.pem", "--ssl-key=/certs/server-key.pem", "--require-secure-transport=ON", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    mem_limit: 768m
  owner-test:
    image: golang:1.25.8
    working_dir: /backend/mysqlstore
    environment:
      EC2_KEYCLOAK_TEST_ADDRESS: mysql:3306
      EC2_KEYCLOAK_TEST_CA: /certs/ca.pem
      GOMAXPROCS: "2"
    volumes: [../../backend:/backend, test-certs:/certs:ro, go-mod:/go/pkg/mod, go-build:/root/.cache/go-build]
    command: [go, test, -mod=readonly, -race, -count=1, -run, Keycloak, ./ec2test]
    depends_on:
      mysql: {condition: service_healthy}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: isolated-admin-test-password
      KC_DB: mysql
      KC_DB_USERNAME: jdbc_fixture
      KC_DB_PASSWORD: isolated-jdbc-test-password
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?sslMode=VERIFY_IDENTITY&fallbackToSystemTrustStore=true
      KC_TRUSTSTORE_PATHS: /certs/ca.pem
      KC_HOSTNAME: http://127.0.0.1:18089/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "2"
      FRAUD_OIDC_CLIENT_SECRET: isolated-client-test-secret
      FRAUD_AUTH_REDIRECT_URI: http://127.0.0.1:18089/api/auth/callback
    volumes: [test-certs:/certs:ro, ../keycloak/fraud-realm.json:/opt/keycloak/data/import/fraud-realm.json:ro]
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 1g
    depends_on:
      mysql: {condition: service_healthy}
  api-gateway:
    extends: {file: ../gateway.compose.yaml, service: api-gateway}
    ports: !override ["127.0.0.1:18089:8080"]
    depends_on:
      keycloak: {condition: service_healthy}
volumes:
  test-certs:
  go-mod:
  go-build:
