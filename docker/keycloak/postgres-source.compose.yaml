# Offline migration/rollback source only. Never part of the normal MySQL stack.
name: fraud-mysql-dev
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: fraud, POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1
  keycloak-postgres:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev]
    env_file: [../../.local/auth-provider/keycloak.env]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/fraud
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: fraud_keycloak
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "5"
      KC_HOSTNAME: http://localhost:8090
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8090:8080"]
    networks:
      default:
        aliases: [keycloak]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
volumes:
  postgres_data:
    external: true
    name: new-fraud-system_postgres_data
