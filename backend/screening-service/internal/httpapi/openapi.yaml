      properties:
        entity_id:
          type: string
        reviewer_id:
          type: string
        unique_counterparty_identifier:
          type: string
          nullable: true
    ContinuousConfigRequest:
      type: object
      description: Payload for creating or updating one continuous-screening configuration.
