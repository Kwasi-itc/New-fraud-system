# Overlay on compose.mysql-test.yaml. Disposable worker acceptance only.
# The decision journey needs its independently generated reference database.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worker_test
      POSTGRES_PASSWORD: isolated-worker-test-only
      POSTGRES_DB: decision_test_worker
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "worker_test", "-d", "decision_test_worker"]
      interval: 2s
      timeout: 2s
      retries: 60
  mysql:
    volumes:
      - ./testdata/mysql-worker-init.sql:/docker-entrypoint-initdb.d/01-worker-tests.sql:ro
  test:
    environment:
      DECISION_MYSQL_TEST_ADDRESS: mysql:3306
      DECISION_MYSQL_REQUIRE_INTEGRATION: "1"
      DECISION_ENGINE_TEST_DATABASE_URL: postgres://worker_test:isolated-worker-test-only@postgres:5432/decision_test_worker?sslmode=disable
      DECISION_ENGINE_REQUIRE_INTEGRATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "scripts/test-mysql-workers.sh"]
