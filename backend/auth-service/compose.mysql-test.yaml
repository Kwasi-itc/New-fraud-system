# Private fixtures only: no application ports, persistent databases or resets.
services:
  mysql:
    image: mysql:8.4.8
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-auth-test-root
      MYSQL_ROOT_HOST: "%"
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: isolated-auth-parity
      POSTGRES_DB: auth_test
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, auth_test, -d, auth_test]
      interval: 2s
      timeout: 2s
      retries: 60
  mysql-reference:
    image: mysql:8.4.8
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-auth-test-root
      MYSQL_ROOT_HOST: "%"
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  test:
    image: golang:1.25.8
    working_dir: /backend/auth-service
    volumes:
      - ..:/backend
      - auth_go_mod:/go/pkg/mod
      - auth_go_build:/root/.cache/go-build
    environment:
      AUTH_MYSQL_TEST_ADDRESS: mysql:3306
      AUTH_REQUIRE_MYSQL_TEST: "1"
      AUTH_MYSQL_REFERENCE_ADDRESS: mysql-reference:3306
      AUTH_PREFLIGHT_TEST_DATABASE_URL: postgres://auth_test:isolated-auth-parity@postgres:5432/auth_test?sslmode=disable
      GOMAXPROCS: "2"
    depends_on:
      mysql: {condition: service_healthy}
      postgres: {condition: service_healthy}
      mysql-reference: {condition: service_healthy}
    command: [sh, scripts/test-mysql.sh]
volumes:
  auth_go_mod:
  auth_go_build:
