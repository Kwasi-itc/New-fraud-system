worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not record query strings, credentials, cookies or request bodies.
    log_format gateway '$remote_addr $service $request_method $uri $status $request_time';
    access_log /dev/stdout gateway;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Resolve service names again after containers are recreated. A missing
    # upstream produces 502 for its route without preventing gateway startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    map $http_host $forwarded_port {
        default 80;
        ~:(?<gateway_host_port>[0-9]+)$ $gateway_host_port;
    }
    # Use the original escaped request target, stripping only the service prefix.
    # Rewriting $uri instead would decode encoded slashes in path parameters.
    map $request_uri $api_request_uri {
        default "";
        ~^/services/[^/?]+(?<api_uri>/.*)$ $api_uri;
    }
    map $document $upstream_encoding {
        default "";
        "" $http_accept_encoding;
    }
    map $service $api_upstream {
        default "";
        data-model data-model-service:8080;
        ingestion ingestion-service:8081;
        decisions decision-engine-service:8082;
        screening screening-service:8085;
        cases case-manager-service:8086;
        auth auth-service:8087;
    }
    map $service $service_prefix {
        default /services/$service;
        "" "";
    }
    map $service $api_origin {
        default "";
        data-model http://localhost:8080;
        ingestion http://localhost:8081;
        decisions http://localhost:8082;
        screening http://localhost:8085;
        cases http://localhost:8086;
        auth http://localhost:8087;
    }
    # These source specifications omit servers (OpenAPI defaults to /).
    # Other services already declare a server, rewritten below for gateway use.
    map $service $gateway_server {
        default "";
        ingestion 'servers: [{url: /services/ingestion}]\n';
        decisions 'servers: [{url: /services/decisions}]\n';
        screening 'servers: [{url: /services/screening}]\n';
    }

    server {
        listen 8080;
        # Keep redirects relative so a custom published host port is preserved.
        absolute_redirect off;
        client_max_body_size 32m;
        client_body_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $service_prefix;
        # Only docs need uncompressed upstream responses for substitutions.
        proxy_set_header Accept-Encoding $upstream_encoding;
        # Forward supplied authentication without generating or injecting tokens.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream off;
        proxy_redirect $api_origin/ $service_prefix/;
        proxy_redirect http://$api_upstream/ $service_prefix/;
        proxy_redirect ~^(/.*)$ $service_prefix$1;
        proxy_cookie_path / $service_prefix/;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","component":"api-gateway"}\n';
        }
        location = /identity { return 308 /identity/$is_args$args; }
        location ^~ /identity/ {
            set $identity_upstream keycloak:8080;
            proxy_pass http://$identity_upstream;
            # These replace the inherited header set. Always overwrite client
            # forwarding headers and preserve Keycloak's actual /identity path.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_redirect off;
            proxy_cookie_path off;
        }
        location = /services { return 308 /services/; }
        # Pinned assets shipped in the image keep Swagger usable without a CDN.
        location /assets/swagger/ {
            alias /usr/share/nginx/html/swagger/;
            add_header Cache-Control "public, max-age=3600";
        }
        location = /services/ {
            default_type text/html;
            return 200 '<!doctype html><html lang="en"><meta charset="utf-8"><title>Fraud API gateway</title><h1>Fraud API gateway</h1><p><a href="/">Open the application</a></p><p>Local PostgreSQL APIs. Existing credentials and tenant permissions apply.</p><ul><li><a href="/services/data-model/docs">Data model</a></li><li><a href="/services/ingestion/docs">Ingestion</a></li><li><a href="/services/decisions/docs">Decisions</a></li><li><a href="/services/screening/docs">Screening</a></li><li><a href="/services/cases/healthz">Cases (health)</a></li><li><a href="/services/auth/healthz">Auth (health)</a></li></ul></html>';
        }
        location ~ ^/services/(?<service>data-model|ingestion|decisions|screening|cases|auth)$ {
            return 308 $service_prefix/$is_args$args;
        }

        # Only documentation responses are rewritten. Business response bodies,
        # callback URLs and bearer/session authentication remain owner-controlled.
        location ~ ^/services/(?<service>data-model|ingestion|decisions|screening|cases|auth)/(?<document>docs|redoc|openapi\.yaml|openapi\.json)$ {
            proxy_pass http://$api_upstream/$document$is_args$args;
            sub_filter_once off;
            sub_filter 'https://unpkg.com/swagger-ui-dist@5/' '/assets/swagger/';
            # Auth's JSON spec currently has no explicit Content-Type.
            sub_filter_types application/json application/yaml text/yaml application/octet-stream text/plain;
            sub_filter '/openapi.yaml' '$service_prefix/openapi.yaml';
            sub_filter '/openapi.json' '$service_prefix/openapi.json';
            sub_filter 'href="/docs"' 'href="$service_prefix/docs"';
            sub_filter 'href="/capabilities"' 'href="$service_prefix/capabilities"';
            sub_filter $api_origin '$service_prefix';
            sub_filter 'openapi: 3.0.3' 'openapi: 3.0.3\n$gateway_server';
        }
        location ~ ^/services/(?<service>data-model|ingestion|decisions|screening|cases|auth)/ {
            proxy_pass http://$api_upstream$api_request_uri;
        }
        location /services/ { return 404; }
        # Preserve frontend pages (/cases, /data-model), /api BFF routes,
        # Next.js assets, login callbacks and streamed server responses.
        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_redirect off;
            proxy_cookie_path off;
            proxy_buffering off;
        }
    }
}
