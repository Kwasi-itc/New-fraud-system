# PostgreSQL main stack, one public gateway. Compose 2.24.4+ supports !reset/!override.
x-private-api: &private-api
  GIN_MODE: release

services:
  postgres:
    ports: !reset []

  auth-service:
    environment:
      AUTH_TOKEN_ENDPOINT_URL: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/oauth/token
      # Login selection is independent of the old frontend demo tenant setting.
      AUTH_DEFAULT_TENANT_ID: ${AUTH_DEFAULT_TENANT_ID:-}
      OIDC_ISSUER_URL: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/identity/realms/fraud
      OIDC_BACKCHANNEL_ORIGIN: http://keycloak:8080
      OIDC_REDIRECT_URL: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/api/auth/callback
      AUTH_APP_ORIGIN: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}

    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro

  keycloak:
    ports: !reset []
    environment:
      KC_HOSTNAME: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      FRAUD_AUTH_REDIRECT_URI: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/api/auth/callback
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /identity/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]

  data-model-service:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/data-model-service.env
    ports: !reset []
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/data-model-service-private.pem:/run/secrets/data-model-service-private.pem:ro

  ingestion-service:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/ingestion-service.env
    ports: !reset []
    environment: *private-api
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/ingestion-service-private.pem:/run/secrets/ingestion-service-private.pem:ro

  ingestion-worker:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/ingestion-worker.env
    environment: *private-api

    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/ingestion-worker-private.pem:/run/secrets/ingestion-worker-private.pem:ro

  decision-engine-service:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/decision-engine-service.env
    ports: !reset []
    environment:
      <<: *private-api
      GEOIP_MMDB_PATH: ""
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/decision-engine-service-private.pem:/run/secrets/decision-engine-service-private.pem:ro
  decision-engine-worker:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/decision-engine-worker.env
    restart: unless-stopped
    environment:
      <<: *private-api
      GEOIP_MMDB_PATH: ""

    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/decision-engine-worker-private.pem:/run/secrets/decision-engine-worker-private.pem:ro

  screening-service:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-service.env
    ports: !reset []
    environment:
      <<: *private-api
      SCREENING_PROVIDER_URL: ${SCREENING_PROVIDER_URL:-}
      SCREENING_PROVIDER_URLS: ${SCREENING_PROVIDER_URLS:-}
      OPENSANCTIONS_API_HOST: ${OPENSANCTIONS_API_HOST:-}
      OPENSANCTIONS_AUTH_METHOD: ${OPENSANCTIONS_AUTH_METHOD:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OPENSANCTIONS_SCOPE: ${OPENSANCTIONS_SCOPE:-default}
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-service-private.pem:/run/secrets/screening-service-private.pem:ro

  screening-worker:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-worker.env
    environment:
      <<: *private-api
      SCREENING_PROVIDER_URL: ${SCREENING_PROVIDER_URL:-}
      SCREENING_PROVIDER_URLS: ${SCREENING_PROVIDER_URLS:-}
      OPENSANCTIONS_API_HOST: ${OPENSANCTIONS_API_HOST:-}
      OPENSANCTIONS_AUTH_METHOD: ${OPENSANCTIONS_AUTH_METHOD:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OPENSANCTIONS_SCOPE: ${OPENSANCTIONS_SCOPE:-default}
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-worker-private.pem:/run/secrets/screening-worker-private.pem:ro

  screening-case-delivery-worker:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-case-delivery-worker.env
    environment: *private-api
    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/screening-case-delivery-worker-private.pem:/run/secrets/screening-case-delivery-worker-private.pem:ro

  case-manager-service:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/case-manager-service.env
    ports: !reset []

    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/case-manager-service-private.pem:/run/secrets/case-manager-service-private.pem:ro

  frontend:
    env_file:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/frontend-bff.env
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_DATA_MODEL_SERVICE_URL: ""
        NEXT_PUBLIC_INGESTION_SERVICE_URL: ""
        NEXT_PUBLIC_DECISION_ENGINE_SERVICE_URL: ""
        NEXT_PUBLIC_DATA_MODEL_TENANT_ID: ""
    environment:
      APP_ORIGIN: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}
      AUTH_MANAGE_SIGN_IN_URL: http://localhost:${POSTGRES_GATEWAY_PORT:-8088}/identity/realms/fraud/account/
      INGESTION_SERVICE_URL: http://ingestion-service:8081
      NEXT_PUBLIC_DATA_MODEL_SERVICE_URL: ""
      NEXT_PUBLIC_INGESTION_SERVICE_URL: ""
      NEXT_PUBLIC_DECISION_ENGINE_SERVICE_URL: ""
      NEXT_PUBLIC_DATA_MODEL_TENANT_ID: ""

    volumes:
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/public-keys.json:/run/secrets/public-keys.json:ro
      - ${PLATFORM_AUTH_DIRECTORY:-./.local/auth-provider}/frontend-bff-private.pem:/run/secrets/frontend-bff-private.pem:ro

  api-gateway:
    extends:
      file: docker/gateway/service.yaml
      service: api-gateway
    ports:
      - 127.0.0.1:${POSTGRES_GATEWAY_PORT:-8088}:8080
    depends_on:
      frontend: {condition: service_healthy}
      keycloak: {condition: service_healthy}

# Preserve the selected database volume regardless of project aliases.
volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-new-fraud-system_postgres_data}
