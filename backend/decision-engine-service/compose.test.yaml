# Standalone disposable PostgreSQL baseline and portable-boundary fixture.
# No application network, published database ports or persistent data volumes.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test_owner
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: decision_test_admin
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_owner -d decision_test_admin"]
      interval: 2s
      timeout: 2s
      retries: 60
  test:
    image: golang:1.25.8
    working_dir: /backend/decision-engine-service
    volumes:
      - ..:/backend
    environment:
      DECISION_ENGINE_TEST_DATABASE_URL: postgres://test_owner:isolated-test-only@postgres:5432/decision_test_admin?sslmode=disable
      DECISION_ENGINE_REQUIRE_INTEGRATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "go mod download && go vet ./... && go test -mod=readonly -race -count=1 -timeout=240s ./..."]
