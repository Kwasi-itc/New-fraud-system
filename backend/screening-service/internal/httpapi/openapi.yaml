openapi: 3.0.3
info:
  title: Screening Service API
  version: 0.2.0
  description: |-
    This service handles screening requests, match review, whitelist management, continuous screening,
    dataset updates, and the related file and callback flows around screening work.
    Legacy owner /v1 operations require the private X-Screening-Operator-Token
    in addition to service authentication. Manual-screenings and investigator
    endpoints retain independent identity checks; internal intake is separate.
tags:
  - name: Service
    description: Basic service checks, metrics, and connection details.
  - name: Provider
    description: Provider dataset and freshness endpoints used to inspect the active screening provider.
  - name: Dataset Updates
    description: Tenant-scoped dataset update jobs used to sync provider list changes.
  - name: Screenings
    description: Screening creation, lookup, retry, match review, comments, enrichment, and evidence-file flows.
  - name: Whitelist
    description: Tenant-scoped whitelist search and maintenance endpoints.
  - name: Continuous Screening
    description: Continuous-screening configuration and monitored-object management.
  - name: Internal
    description: Internal service-to-service screening intake routes.
paths:
  /v1/manual-screenings/capabilities:
    get:
      tags: [Provider]
      summary: Capabilities of the fixed manual screening provider
      description: Active investigator session and current tenant membership required. Deployment configuration only, not tenant entitlements or health. No outbound provider call. No secrets or endpoint addresses. Same private no-store policy as manual searches.
      security: [{investigatorJWT: []}]
      responses:
        '200':
          description: Public capability projection. Health remains unknown until independently verified. Live enrichment is not exposed by this manual API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, enum: [opensanctions]}
                  name: {type: string}
                  adapter: {type: string, enum: [generic, opensanctions_match]}
                  configured: {type: boolean}
                  health: {type: string, enum: [unknown]}
                  entity_types: {type: array, items: {type: string}}
                  fields: {type: object, additionalProperties: {type: array, items: {type: string}}}
                  dataset_selection: {type: boolean}
                  threshold_min: {type: integer}
                  threshold_max: {type: integer}
                  limit_max: {type: integer}
                  threshold_semantics: {type: string}
                  result_semantics: {type: string}
                  candidate_metadata: {type: array, items: {type: string}}
                  live_enrichment: {type: boolean}
                  limitations: {type: array, items: {type: string}}
        '401': {description: Missing or invalid session}
        '403': {description: Investigator role or active tenant membership missing}
        '503': {description: Screening infrastructure unavailable}
  /v1/manual-screenings:
    get:
      tags: [Screenings]
      summary: List the current creator's persisted manual searches
      description: Active investigator session required; admins also see only their own searches. Tenant and creator are derived from the JWT. Ordered by created_at descending then ID descending. Follow next_cursor; opening a result never reruns its provider.
      security: [{investigatorJWT: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}, description: Opaque next_cursor from the prior page; reset when filters change.}
        - {name: status, in: query, schema: {type: string, enum: [pending, queued, processing, awaiting_review, no_hit, confirmed_hit, failed, archived]}}
        - {name: entity_type, in: query, schema: {type: string, enum: [Person, Organization]}}
        - {name: from, in: query, schema: {type: string, format: date}, description: Inclusive UTC date}
        - {name: to, in: query, schema: {type: string, format: date}, description: Inclusive UTC date}
      responses:
        '200':
          description: Bounded history projection; empty next_cursor means no more rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_cursor: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        entity_type: {type: string}
                        status: {type: string}
                        partial: {type: boolean}
                        created_at: {type: string, format: date-time}
        '400': {description: Invalid filters, cursor or unknown parameters}
        '401': {description: Invalid session}
        '403': {description: Current role or membership denied}
        '503': {description: History unavailable}
    post:
      tags: [Screenings]
      summary: Queue a creator-scoped manual name search
      description: Requires an active platform session with investigator or case-manager-admin role. Tenant and actor come only from the JWT. Persists the search and River job atomically. Retry an uncertain response with identical operation ID and input. A concurrent first insert can return 503; retry the same operation. No case is created by this endpoint.
      security: [{investigatorJWT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, name, entity_type, limit]
              properties:
                operation_id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 200}
                entity_type: {type: string, enum: [Person, Organization]}
                threshold: {type: integer, minimum: 0, maximum: 100, default: 0, description: 'UI defaults to 70; omitted API value means 0.'}
                limit: {type: integer, minimum: 1, maximum: 50}
                birth_date: {type: string, description: 'Person only; YYYY or valid YYYY-MM-DD, no future dates.'}
                nationality: {type: string, description: 'Person only; ISO alpha2 country code, normalized lowercase.'}
                country: {type: string, description: 'Organization only; ISO alpha2 country code, normalized lowercase.'}
                registration_number: {type: string, maxLength: 100, description: Organization only}
                address: {type: string, maxLength: 300}
                datasets:
                  type: array
                  maxItems: 10
                  items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,79}$'}
                  description: 'Provider include_dataset filters; syntax validated locally, catalog membership and entitlement provider-dependent.'
      responses:
        '202':
          description: Created or identical replay; fetch the result by ID even when replay status is terminal.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string}
        '400': {description: Invalid input, unknown fields or body exceeding 4KiB}
        '401': {description: Invalid or missing platform session}
        '403': {description: Role or current membership/session denied}
        '409': {description: Operation ID reused with different input}
        '415': {description: Expected application/json}
        '503': {description: Identity, queue, persistence or configuration unavailable}
  /v1/manual-screenings/{id}:
    get:
      tags: [Screenings]
      summary: Read the authenticated creator's persisted manual search
      description: Rechecks current membership. Tenant, creator and manual-only boundaries enforced before returning matches. Decision/scenario screenings cannot be accessed here. Never returns raw requests, provider errors or credentials. Result details are persisted snapshots, not live enrichment.
      security: [{investigatorJWT: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current run state and score-ordered candidates; partial remains meaningful even with no candidates.
          content:
            application/json:
              schema:
                type: object
                required: [id, provider, status, partial, created_at, matches]
                properties:
                  id: {type: string, format: uuid}
                  provider: {type: string, description: Provider identifier only; no endpoint or credentials.}
                  status: {type: string, enum: [pending, queued, processing, awaiting_review, no_hit, confirmed_hit, failed, archived]}
                  partial: {type: boolean}
                  created_at: {type: string, format: date-time}
                  query:
                    type: object
                    description: Whitelisted original name, entity_type, threshold, limit and identifying fields/datasets. No credentials or raw provider configuration; operation_id empty.
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        entity_id: {type: string}
                        status: {type: string, description: Persisted candidate review state at retrieval.}
                        name: {type: string}
                        score: {type: number}
                        schema: {type: string}
                        datasets: {type: array, nullable: true, items: {type: string}}
                        properties:
                          type: object
                          description: Optional alias, country, nationality, birthDate, address and topics arrays only.
                          additionalProperties: {type: array, items: {type: string}}
        '400': {description: Invalid identifier}
        '401': {description: Invalid or missing platform session}
        '403': {description: Role or current membership/session denied}
        '404': {description: Not found or outside tenant/creator/manual scope}
        '503': {description: Identity or screening service unavailable}
  /v1/investigator/tenants/{tenantId}/cases/{caseId}/exclusions:
    get:
      summary: Read exclusion actions or suppression applications within an authorized case
      description: Signed current investigator session and case/inbox access required. Without operation_id returns actions recorded in this case with current scoped exclusion state. With operation_id returns only its applications linked to this same case; the operation must belong to the case. No other case evidence is exposed. Closed cases remain readable; mutations use the existing review endpoint and require reopening. No provider calls.
      security: [{investigatorJWT: []}]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: operation_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}, description: Opaque next_cursor from the same listing. Empty starts the first page.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Descending timestamp and ID keyset page, no-store. Exactly one array is populated. An empty application page is not evidence that the exclusion was never used in other cases.
          content:
            application/json:
              schema:
                type: object
                required: [events, applications, next_cursor]
                properties:
                  next_cursor: {type: string}
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        operation_id: {type: string, format: uuid}
                        match_id: {type: string}
                        object_type: {type: string}
                        object_id: {type: string}
                        provider: {type: string}
                        entity_id: {type: string}
                        actor_id: {type: string}
                        findings: {type: string}
                        activated: {type: boolean, description: Historical action state}
                        active: {type: boolean, description: Current scoped exclusion state}
                        created_at: {type: string, format: date-time}
                  applications:
                    type: array
                    items:
                      type: object
                      properties:
                        screening_id: {type: string, format: uuid}
                        match_id: {type: string}
                        applied_at: {type: string, format: date-time}
        '400': {description: Invalid identifier, cursor or limit}
        '401': {description: Missing or invalid session}
        '403': {description: Current identity, tenant, case, inbox or operation access denied}
        '500': {description: Redacted history read failure}
        '503': {description: Identity or service configuration unavailable}
  /v1/investigator/tenants/{tenantId}/cases/{caseId}/review:
    parameters:
      - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read current linked-resource investigator review eligibility
      description: Requires the original signed human JWT and current tenant, case, inbox and exact resource access. Service credentials cannot authorize this route.
      security: [{investigatorJWT: []}]
      parameters:
        - {name: resource_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative review state; closed cases and inactive inboxes are not eligible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvestigatorReviewState'}
        '400': {description: Invalid identifiers}
        '401': {description: Invalid investigator session}
        '403': {description: Current case or resource access denied}
        '500': {description: Owner state could not be read}
    post:
      summary: Record a human review or scoped exclusion removal with atomic case history
      description: Open linked case and active inbox required. Only actions returned by GET are allowed. Continuous candidates may support dismiss_and_exclude for the same tenant, object type/ID, provider, entity and identifying query fingerprint; manual/scenario exclusions are unavailable. Removal from an accessible dismissed candidate affects future screenings only and remains available when its source screening is archived. Removal writes exclusion audit, review receipt and case history without changing the historical screening, candidate or match comments. Closed cases still require reopening and inaccessible cases remain denied. Findings are trimmed and limited to 10000 UTF-8 bytes including the server action prefix for exclusion actions (use at most 9900). Original actor is verified from JWT; extra fields are rejected. Retry uncertain responses with the identical operation ID and payload. Human review does not change case lifecycle or machine outcome.
      security: [{investigatorJWT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, resource_id, expected_version, action, findings]
              properties:
                operation_id: {type: string, format: uuid}
                resource_id: {type: string}
                expected_version: {type: string}
                action: {type: string, enum: [confirmed_hit, no_hit, dismiss_and_exclude, remove_exclusion]}
                findings: {type: string, minLength: 1}
      responses:
        '200':
          description: Committed result or authorized identical-operation replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvestigatorReviewState'}
        '400': {description: Invalid command or case lifecycle}
        '401': {description: Invalid investigator session}
        '403': {description: Current case or resource access denied}
        '409': {description: Stale state or conflicting operation}
        '500': {description: Database failure or uncertain acknowledgement. Retry the same operation to determine the committed result.}
  /healthz:
    get:
      tags: [Service]
      summary: Liveness probe
      description: Quick check that the screening service is up and responding.
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Service]
      summary: Readiness probe
      description: Checks whether the screening service is ready to handle requests.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics:
    get:
      tags: [Service]
      summary: Get request metrics snapshot
      description: Returns the current in-memory request metrics snapshot for the service.
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /v1/service-info:
    get:
      tags: [Service]
      summary: Get service connection details
      description: Shows the downstream services and provider settings currently configured for screening-service.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
      responses:
        '200':
          description: Service information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'
  /v1/screening-provider/catalog:
    get:
      tags: [Provider]
      summary: Get provider dataset catalog
      description: Returns the provider dataset catalog payload for the selected provider.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - name: provider
          in: query
          description: Provider key to inspect. If omitted, the default provider is used.
          schema:
            type: string
      responses:
        '200':
          description: Provider catalog payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/screening-provider/freshness:
    get:
      tags: [Provider]
      summary: Get provider dataset freshness
      description: Returns the provider freshness payload for the selected provider.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - name: provider
          in: query
          description: Provider key to inspect. If omitted, the default provider is used.
          schema:
            type: string
      responses:
        '200':
          description: Provider freshness payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/dataset-update-jobs:
    get:
      tags: [Dataset Updates]
      summary: List dataset update jobs
      description: Lists dataset update jobs for one tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Dataset update job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Dataset Updates]
      summary: Create a dataset update job
      description: Creates a dataset update job for one tenant and provider.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetUpdateJobRequest'
            example:
              provider: opensanctions
              job_type: delta_sync
              cursor: ""
      responses:
        '201':
          description: Dataset update job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/dataset-update-jobs/{jobId}:
    get:
      tags: [Dataset Updates]
      summary: Get one dataset update job
      description: Returns one dataset update job by id.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Dataset update job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantId}/dataset-update-jobs/{jobId}/retry:
    post:
      tags: [Dataset Updates]
      summary: Retry a dataset update job
      description: Requeues a dataset update job that needs another attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Dataset update job retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/screenings:
    post:
      tags: [Screenings]
      summary: Create a decision-linked screening
      description: Creates a screening request tied to a decision and returns the screening record.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreeningRequest'
      responses:
        '201':
          description: Screening created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/screenings/freeform-search:
    post:
      tags: [Screenings]
      summary: Create a freeform screening
      description: Creates a manual screening request that is not tied to a decision.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreeningRequest'
      responses:
        '201':
          description: Freeform screening created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/decisions/{decisionId}/screenings:
    get:
      tags: [Screenings]
      summary: List screenings created for a decision
      description: Lists screening records created from one decision.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; not a browser credential.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DecisionId'
      responses:
        '403':
          description: Private owner credential missing, invalid or unconfigured.
        '200':
          description: Screenings for the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
  /v1/tenants/{tenantId}/screenings/{screeningId}:
    get:
      tags: [Screenings]
      summary: Get screening detail
      description: Returns the screening plus its related matches and comments.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; not a browser credential.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ScreeningId'
      responses:
        '403':
          description: Private owner credential missing, invalid or unconfigured.
        '200':
          description: Screening detail payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantId}/screenings/{screeningId}/retry:
    post:
      tags: [Screenings]
      summary: Retry a screening
      description: Requeues a screening that needs another provider attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private source-recovery credential, distinct from service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ScreeningId'
      responses:
        '403':
          description: Private recovery credential missing, invalid or unconfigured.
        '200':
          description: Screening retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/screening-matches/{matchId}/review:
    post:
      tags: [Screenings]
      summary: Review a screening match
      description: Records a review outcome for one screening match and can optionally whitelist it.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMatchRequest'
      responses:
        '200':
          description: Match reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/tenants/{tenantId}/screening-matches/{matchId}/comments:
    post:
      tags: [Screenings]
      summary: Add a comment to a screening match
      description: Adds a reviewer comment to one screening match.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Screening-Operator-Token
          in: header
          required: true
          description: Private owner credential; additional to service authentication.
          schema:
            type: string
            minLength: 32
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
