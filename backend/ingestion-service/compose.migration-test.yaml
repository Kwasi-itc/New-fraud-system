# Disposable PostgreSQL characterization for portable ingestion boundaries.
# Uses no application network/volume and publishes no ports.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: migration_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: ingestion_test_baseline
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./testdata/migration-init.sql:/docker-entrypoint-initdb.d/migration-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_test -d ingestion_test_baseline"]
      interval: 2s
      timeout: 2s
      retries: 60
  test:
    image: golang:1.25.8
    network_mode: service:postgres
    working_dir: /backend/ingestion-service
    volumes:
      - ..:/backend
    environment:
      INGESTION_TEST_DATABASE_URL: postgres://migration_test:isolated-test-only@localhost:5432/ingestion_test_baseline?sslmode=disable
      CONTRACT_TEST_DATABASE_URL: postgres://migration_test:isolated-test-only@localhost:5432/contract_baseline?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        go mod download &&
        go vet ./... && go test -mod=readonly -race -count=1 -timeout=180s -v ./...
