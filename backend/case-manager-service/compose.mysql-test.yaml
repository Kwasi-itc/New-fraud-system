# Disposable tests only; no published ports and no application data volume.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: case_test
      POSTGRES_PASSWORD: isolated-case-parity
      POSTGRES_DB: case_test
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, case_test, -d, case_test]
      interval: 2s
      timeout: 2s
      retries: 60
  mysql:
    image: mysql:8.4.8
    command: [--log-bin-trust-function-creators=ON]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-case-test-root
      MYSQL_ROOT_HOST: "%"
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  mysql-reference:
    image: mysql:8.4.8
    command: [--log-bin-trust-function-creators=ON]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-case-test-root
      MYSQL_ROOT_HOST: "%"
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  test:
    image: golang:1.25.8
    working_dir: /backend/case-manager-service
    volumes:
      - ..:/backend
      - case_go_mod:/go/pkg/mod
      - case_go_build:/root/.cache/go-build
    environment:
      CASE_MYSQL_TEST_ADDRESS: mysql:3306
      CASE_MYSQL_REFERENCE_ADDRESS: mysql-reference:3306
      CASE_REQUIRE_MYSQL_TEST: "1"
      CASE_TEST_REPORT_DIR: /backend/case-manager-service/evidence
      CASE_MANAGER_TEST_DATABASE_URL: postgres://case_test:isolated-case-parity@postgres:5432/case_test?sslmode=disable
      GOMAXPROCS: "2"
    depends_on:
      mysql: {condition: service_healthy}
      mysql-reference: {condition: service_healthy}
      postgres: {condition: service_healthy}
    command: [sh, scripts/test-mysql.sh]
volumes:
  case_go_mod:
  case_go_build:
